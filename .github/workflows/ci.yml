name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run tests with coverage
      run: |
        PYTHONPATH=src pytest tests/ -q --cov=src --cov-report=term-missing --cov-fail-under=60
    - name: Secret scan stub (gitleaks-style)
      run: |
        echo "Secret scanning placeholder - no secrets expected"
